<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Home Exercise Timer</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#121417">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Exercise Timer">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>Home Exercise Timer</h1>
</header>

<!-- ===================== WORKOUT BUILDER SCREEN ===================== -->
<section id="screen-builder" class="screen">

  <div class="card">
    <h2>My Workout</h2>
    <div id="workout-list" class="workout-list"><p class="empty-msg">No sets added yet.</p></div>
    <div id="total-time" class="total-time"></div>
    <button id="btn-start-workout" class="btn btn-primary btn-block">Start Workout</button>
  </div>

  <div class="card">
    <h2>Saved Sets</h2>
    <div id="saved-sets-list" class="saved-sets-list"></div>
    <button id="btn-new-set" class="btn btn-secondary btn-block">+ Create New Set</button>
  </div>

</section>

<!-- ===================== SET EDITOR SCREEN ===================== -->
<section id="screen-editor" class="screen hidden">
  <div class="card">
    <h2>Create Set</h2>

    <label>Set Name</label>
    <input type="text" id="set-name" placeholder="e.g. Morning Routine">

    <label>Exercises</label>
    <div id="exercise-checklist" class="exercise-checklist"></div>

    <label>Exercise Duration</label>
    <select id="exercise-duration">
      <option value="15">15 sec</option>
      <option value="20">20 sec</option>
      <option value="30" selected>30 sec</option>
      <option value="45">45 sec</option>
      <option value="60">60 sec</option>
    </select>

    <label>Rest Between Exercises</label>
    <select id="exercise-rest">
      <option value="0">0 sec</option>
      <option value="5">5 sec</option>
      <option value="10" selected>10 sec</option>
      <option value="15">15 sec</option>
      <option value="20">20 sec</option>
    </select>

    <label>Repeat</label>
    <select id="repeat-count">
      <option value="1" selected>1 time</option>
      <option value="2">2 times</option>
      <option value="3">3 times</option>
      <option value="4">4 times</option>
    </select>

    <label>Rest Between Repeats (Set Rest)</label>
    <select id="set-rest">
      <option value="30">30 sec</option>
      <option value="60" selected>60 sec</option>
      <option value="90">90 sec</option>
      <option value="120">120 sec</option>
    </select>

    <div class="btn-row">
      <button id="btn-cancel-set" class="btn btn-secondary">Cancel</button>
      <button id="btn-save-set" class="btn btn-primary">Save Set</button>
    </div>
  </div>
</section>

<!-- ===================== TIMER SCREEN ===================== -->
<section id="screen-timer" class="screen hidden">
  <div class="timer-wrap">
    <div id="timer-set-name" class="timer-set-name">SET NAME</div>
    <div id="timer-round" class="timer-round">Round 1 of 2</div>
    <div id="timer-phase" class="timer-phase">JUMPING JACKS</div>
    <div id="timer-clock" class="timer-clock">00:30</div>
    <div id="timer-next" class="timer-next">Next: Squats</div>

    <div class="timer-controls">
      <button id="btn-pause" class="btn btn-primary">Pause</button>
      <button id="btn-skip" class="btn btn-secondary">Skip</button>
      <button id="btn-exit" class="btn btn-secondary">Exit</button>
    </div>
  </div>
</section>

<!-- ===================== COMPLETE SCREEN ===================== -->
<section id="screen-complete" class="screen hidden">
  <div class="timer-wrap">
    <div class="timer-phase">WORKOUT COMPLETE</div>
    <p class="complete-msg">Great job!</p>
    <div class="timer-controls">
      <button id="btn-again" class="btn btn-primary">Again</button>
      <button id="btn-back" class="btn btn-secondary">Back to Workout</button>
    </div>
  </div>
</section>

<script src="app.js"></script>
</body>
</html>
